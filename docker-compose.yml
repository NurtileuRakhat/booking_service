version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Nurtiley17
      - DB_NAME=booking_service
      - DB_SSLMODE=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_ADMIN_CALENDAR_CREDENTIALS=/app/config/credentials.json
      - GOOGLE_ADMIN_CALENDAR_ID=${GOOGLE_ADMIN_CALENDAR_ID}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - booking-network

  postgres:
    image: postgres:15-alpine
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Nurtiley17
      - POSTGRES_DB=booking_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/infrastructure/repository/migrations:/docker-entrypoint-initdb.d

    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge

volumes:
  postgres-data:
